name: Build Flutter APK (experimental)
on:
  workflow_dispatch:
  push:
    paths: ['flutter/**', '.github/workflows/flutter.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - name: Tests (core, ui_kit, app)
        run: |
          for d in packages/core packages/ui_kit apps/mobile; do
            (cd $d && flutter pub get && flutter analyze && flutter test)
          done
      - name: Prepare signing key
        env:
          BUNDLE: ${{ secrets.SIGNING_BUNDLE }}
        run: |
          if [ -n "$BUNDLE" ]; then
            printf '%s' "$BUNDLE" | sed -n '1p' > "$RUNNER_TEMP/pass.txt"
            printf '%s' "$BUNDLE" | sed -n '2p' | base64 -d > "$RUNNER_TEMP/diwan.jks"
            echo "DIWAN_STORE_PASS=$(cat $RUNNER_TEMP/pass.txt)" >> "$GITHUB_ENV"
            echo "DIWAN_KEYSTORE=$RUNNER_TEMP/diwan.jks" >> "$GITHUB_ENV"
            echo "DIWAN_KEY_ALIAS=diwan" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_BUNDLE غير موجود: التوقيع بمفتاح debug (قد يتعارض عند التحديث فوق نسخة سابقة)"
          fi
      - name: Build APK
        working-directory: flutter/apps/mobile
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: Al-Diwan-Flutter-APK
          path: flutter/apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
