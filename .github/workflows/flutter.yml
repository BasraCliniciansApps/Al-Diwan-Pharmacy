name: Build Flutter APK (experimental)
on:
  workflow_dispatch:
  push:
    paths: ['flutter/**', '.github/workflows/flutter.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - name: Tests (core, ui_kit, app)
        run: |
          for d in packages/core packages/ui_kit apps/mobile; do
            (cd $d && flutter pub get && flutter analyze && flutter test)
          done
      - name: Prepare signing key
        env:
          BUNDLE: ${{ secrets.SIGNING_BUNDLE }}
        run: |
          if [ -n "$BUNDLE" ]; then
            printf '%s' "$BUNDLE" | sed -n '1p' > "$RUNNER_TEMP/pass.txt"
            printf '%s' "$BUNDLE" | sed -n '2p' | base64 -d > "$RUNNER_TEMP/diwan.jks"
            echo "DIWAN_STORE_PASS=$(cat $RUNNER_TEMP/pass.txt)" >> "$GITHUB_ENV"
            echo "DIWAN_KEYSTORE=$RUNNER_TEMP/diwan.jks" >> "$GITHUB_ENV"
            echo "DIWAN_KEY_ALIAS=diwan" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_BUNDLE غير موجود: التوقيع بمفتاح debug (قد يتعارض عند التحديث فوق نسخة سابقة)"
          fi
      - name: Build APK
        working-directory: flutter/apps/mobile
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/Al-Diwan-Flutter.apk"
        working-directory: flutter/apps/mobile
      # رابط تنزيل مباشر ثابت يُحدَّث مع كل بناء:
      # https://github.com/BasraCliniciansApps/Al-Diwan-Pharmacy/releases/download/flutter-latest/Al-Diwan-Flutter.apk
      # لا يُنشر الرابط إلا بعد اجتياز جدول المقارنة مع الويب: يُضاف [release] لرسالة الـcommit أو يُشغَّل يدوياً
      - name: Publish rolling release
        if: contains(github.event.head_commit.message, '[release]') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-latest
          target_commitish: ${{ github.sha }}
          name: صيدلية الديوان Flutter (تجريبي) — آخر بناء
          body: "آخر بناء تجريبي من فرع ${{ github.ref_name }} (commit ${{ github.sha }}). ثبّته بجانب التطبيق الحالي."
          prerelease: true
          make_latest: false
          files: Al-Diwan-Flutter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Al-Diwan-Flutter-APK
          path: flutter/apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
