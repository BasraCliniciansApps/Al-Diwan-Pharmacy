<style>
:root {
    --navy: #0f1c38; --navy-soft: #1b2c52; --gold: #f9a825; --gold-dark: #a85d08;
    --bg: #f1f4f9; --surface: #ffffff; --surface-2: #f6f8fc; --text: #0f1c38; --sub: #64748b; --line: #e2e8f0;
    --ok: #16a34a; --noph: #d97706; --nosup: #dc2626; --back: #2563eb;
    --shadow: 0 1px 2px rgba(15,28,56,.06), 0 6px 18px rgba(15,28,56,.06);
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0a1020; --surface: #141e36; --surface-2: #1a2745; --text: #e8edf7; --sub: #9aa8c2; --line: #2a3857;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; overflow-x: hidden; max-width: 100%; touch-action: pan-y; overscroll-behavior-x: none; }
body { position: relative; }
textarea, input { touch-action: manipulation; }
body { font-family: 'Tajawal', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
button { font-family: inherit; }
svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

/* ---------- الترويسة الثابتة ---------- */
:root { --hh: 150px; --fh: 50px; }
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 30; background: linear-gradient(160deg, var(--navy) 0%, var(--navy-soft) 100%); color: #fff; padding: calc(10px + env(safe-area-inset-top)) 14px 14px; border-radius: 0 0 26px 26px; box-shadow: 0 8px 26px rgba(8,14,30,.32); overflow: hidden; }
.top::before { content: ''; position: absolute; inset: 0; opacity: .07; background-image: radial-gradient(circle at 1px 1px, #fff 1px, transparent 0); background-size: 18px 18px; pointer-events: none; }
.top-in { position: relative; max-width: 732px; margin: 0 auto; }
.top-row { display: flex; align-items: center; gap: 10px; }
.top img { width: 42px; height: 42px; border-radius: 13px; object-fit: cover; box-shadow: 0 4px 14px rgba(0,0,0,.35); flex: 0 0 auto; }
.brand { flex: 1; min-width: 0; }
.brand b { display: block; font-family: 'Aref Ruqaa', serif; font-size: 1.3rem; color: var(--gold); line-height: 1.2; white-space: nowrap; }
.brand small { display: flex; align-items: center; gap: 5px; font-size: .68rem; color: #cbd5e1; font-weight: 500; margin-top: 1px; white-space: nowrap; }
.hbtn { position: relative; flex: 0 0 auto; width: 38px; height: 38px; border-radius: 12px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.1); color: #fff; font-size: 1.1rem; display: grid; place-items: center; cursor: pointer; }
.hbtn.on { background: var(--gold); border-color: var(--gold); color: #0f1c38; } .hbtn.on svg { fill: currentColor; }
.hbtn i { position: absolute; top: -5px; inset-inline-start: -5px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--gold); color: #0f1c38; font: 800 .62rem/17px 'Tajawal', sans-serif; font-style: normal; text-align: center; }
.hbtn i:empty { display: none; }
.srow { margin-top: 12px; display: flex; gap: 8px; align-items: center; } .srow .search { margin-top: 0; flex: 1; min-width: 0; }
.fbt { position: relative; flex: 0 0 48px; width: 48px; height: 48px; border-radius: 16px; border: 1.5px solid #cbd5e1; background: #fff; color: #0f1c38; display: grid; place-items: center; font-size: 1.25rem; cursor: pointer; } .fbt.on { background: var(--gold); border-color: var(--gold); }
.fbt i { position: absolute; top: -6px; inset-inline-start: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: #0d9488; color: #fff; font: 800 .7rem/20px 'Tajawal', sans-serif; font-style: normal; text-align: center; } .fbt i:empty { display: none; }
.tfbg { position: fixed; inset: 0; z-index: 27; display: none; background: rgba(8,14,30,.35); backdrop-filter: blur(2px); } .tfbg.show { display: block; }
.tfh { position: fixed; z-index: 28; top: calc(var(--hh) + 6px); left: 12px; right: 12px; max-width: 640px; margin: 0 auto; display: none; } .tfh.show { display: block; }
.search { margin-top: 12px; display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 16px; padding: 0 14px; height: 48px; border: 1px solid var(--line); }
.search svg { font-size: 1.2rem; color: var(--sub); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: 500 1rem 'Tajawal', sans-serif; color: var(--text); height: 100%; }
.search input::placeholder { color: var(--sub); }
.search button { border: 0; background: var(--surface-2); color: var(--sub); width: 28px; height: 28px; border-radius: 50%; display: none; place-items: center; cursor: pointer; }
.search.has button { display: grid; }

/* ---------- التذييل الثابت ---------- */
.foot { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: linear-gradient(160deg, var(--navy) 0%, var(--navy-soft) 100%); color: #fff; border-radius: 22px 22px 0 0; padding: 11px 18px calc(11px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 26px rgba(8,14,30,.3); }
.foot-in { max-width: 732px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: .78rem; }
.foot-l { display: flex; align-items: center; gap: 8px; min-width: 0; }
.foot-l b { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.foot-l em { font-style: normal; background: rgba(255,255,255,.14); border-radius: 999px; padding: 1px 10px; font-weight: 800; color: var(--gold); }
.clr { flex: 0 0 auto; border: 0; background: rgba(255,255,255,.18); color: #fff; width: 22px; height: 22px; border-radius: 50%; display: none; place-items: center; cursor: pointer; font-size: .74rem; }
.clr.show { display: grid; }
.foot-r { display: flex; align-items: center; gap: 7px; color: #cbd5e1; font-weight: 500; white-space: nowrap; }
.foot-r i { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 3px rgba(52,211,153,.25); }

/* ---------- التابات الجانبية الثابتة (بين الترويسة والتذييل) ---------- */
.main { max-width: 760px; margin: 0 auto; padding: calc(var(--hh) + 14px) 14px calc(var(--fh) + 22px) 14px; padding-inline-start: 50px; }
.rail { position: fixed; z-index: 20; top: var(--hh); bottom: var(--fh); right: max(0px, calc((100vw - 760px) / 2)); display: flex; flex-direction: column; justify-content: center; align-items: flex-end; gap: clamp(5px, 1vh, 8px); padding: 8px 0; pointer-events: none; }
.tab { pointer-events: auto; position: relative; flex: 0 1 auto; width: 36px; min-height: 0; border: 0; background: var(--surface); color: var(--text); border-radius: 14px 0 0 14px; padding: 9px 0 10px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; box-shadow: var(--shadow), inset 3px 0 0 var(--c); transition: transform .26s cubic-bezier(.2,.9,.25,1.2), background .2s, color .2s, box-shadow .2s; }
.tab .ic { display: none; }
.tab .lb { writing-mode: vertical-rl; font-size: clamp(.58rem, 1.75vh, .72rem); font-weight: 800; line-height: 1; letter-spacing: 0; color: var(--text); white-space: nowrap; }
.tab .ct { order: -1; font-size: .7rem; font-weight: 800; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); border-radius: 999px; padding: 2px 0; width: 24px; text-align: center; }
.tab.on { transform: translateX(-8px); background: var(--c); box-shadow: 0 8px 20px color-mix(in srgb, var(--c) 45%, transparent); }
.tab.on::after { content: ''; position: absolute; top: 0; bottom: 0; right: -8px; width: 8px; background: var(--c); }
.tab.on .lb { color: #fff; } .tab.on .ct { background: rgba(255,255,255,.26); color: #fff; }
.tab:active { filter: brightness(.96); }
.t-ok { --c: var(--ok); } .t-noph { --c: var(--noph); } .t-nosup { --c: var(--nosup); } .t-back { --c: var(--back); }

/* ---------- القائمة ---------- */
.list { display: flex; flex-direction: column; gap: 10px; }
.list.anim .card { animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.card { position: relative; cursor: pointer; display: grid; grid-template-columns: 54px minmax(0, 1fr) 92px; gap: 8px 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 13px 16px 13px 14px; box-shadow: var(--shadow); }
.card::before { content: ''; position: absolute; inset-block: 12px; inset-inline-start: 0; width: 4px; border-radius: 0 4px 4px 0; background: var(--c); }
.card .nm { min-width: 0; }
.card .nm b { display: block; font-size: .95rem; font-weight: 800; line-height: 1.45; overflow-wrap: anywhere; }
.card .nm small { display: block; color: var(--sub); font-size: .74rem; margin-top: 2px; line-height: 1.5; overflow-wrap: anywhere; }
.card .pr { text-align: end; font-weight: 800; color: var(--gold-dark); font-size: 1rem; line-height: 1.2; }
.card .pr small { display: block; font-size: .66rem; font-weight: 700; color: var(--sub); margin-top: 2px; }
:root[data-theme="dark"] .card .pr { color: var(--gold); }
.chip { grid-column: 1 / -1; justify-self: start; display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 800; color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); border-radius: 999px; padding: 4px 11px 4px 12px; }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.chip em { font-style: normal; font-weight: 600; color: var(--sub); }
.s-ok { --c: var(--ok); } .s-noph { --c: var(--noph); } .s-nosup { --c: var(--nosup); } .s-back { --c: var(--back); }
.more { border: 1.5px dashed var(--line); background: transparent; color: var(--text); border-radius: 16px; padding: 13px; font: 800 .85rem 'Tajawal', sans-serif; cursor: pointer; }
.empty { text-align: center; color: var(--sub); padding: 46px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: 18px; }
.empty svg { font-size: 2.2rem; opacity: .6; margin-bottom: 8px; } .empty b { display: block; color: var(--text); margin-bottom: 4px; }
.sk { height: 84px; border-radius: 18px; background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: sh 1.2s infinite; border: 1px solid var(--line); }
@keyframes sh { to { background-position: -200% 0; } }
.tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.pill { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; padding: 8px 14px 8px 16px; font: 800 .78rem 'Tajawal', sans-serif; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; box-shadow: var(--shadow); }
.pill svg { font-size: 1.05rem; } .pill.on { background: var(--navy); color: #fff; border-color: var(--navy); }
:root[data-theme="dark"] .pill.on { background: var(--gold); color: #0f1c38; border-color: var(--gold); }
.acts { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.acts .chip { margin-inline-end: auto; }
.acts.u { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px 6px; }
.acts.u .chip { grid-column: 1 / -1; justify-self: start; margin: 0; }
.acts.u .need { justify-content: center; }
.ib { width: 34px; height: 34px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface-2); color: var(--sub); display: grid; place-items: center; cursor: pointer; font-size: 1.05rem; }
.ib.on { color: var(--gold-dark); background: color-mix(in srgb, var(--gold) 20%, transparent); border-color: var(--gold); }
.ib.on svg { fill: var(--gold); }
.need { border: 1px solid var(--c); color: var(--c); background: transparent; border-radius: 11px; padding: 0 11px; height: 34px; font: 800 .72rem 'Tajawal', sans-serif; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.need.done { opacity: .55; pointer-events: none; }
.tag { font-size: .64rem; font-weight: 800; border-radius: 999px; padding: 2px 8px; background: color-mix(in srgb, var(--gold) 22%, transparent); color: var(--gold-dark); margin-inline-start: 6px; vertical-align: middle; white-space: nowrap; }
:root[data-theme="dark"] .tag { color: var(--gold); }
.alts { grid-column: 1 / -1; border-top: 1px dashed var(--line); padding-top: 8px; }
.alts summary { cursor: pointer; font-size: .78rem; font-weight: 800; color: var(--ok); list-style: none; display: flex; align-items: center; gap: 7px; }
.alts summary::-webkit-details-marker { display: none; } .alts summary::after { content: '‹'; margin-inline-start: auto; transition: transform .2s; font-size: 1.1rem; } .alts[open] summary::after { transform: rotate(-90deg); }
.alt { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .82rem; font-weight: 700; background: var(--surface-2); border-radius: 12px; padding: 9px 11px; margin-top: 6px; }
.alt b { color: var(--gold-dark); white-space: nowrap; } :root[data-theme="dark"] .alt b { color: var(--gold); }
.noalt { font-size: .74rem; color: var(--sub); padding-top: 8px; grid-column: 1 / -1; }
.bg { position: fixed; inset: 0; z-index: 60; background: rgba(8,14,30,.55); display: none; align-items: flex-end; justify-content: center; backdrop-filter: blur(2px); }
.bg.show { display: flex; }
.sheet { width: 100%; max-width: 640px; max-height: 88vh; overflow: auto; background: var(--bg); border-radius: 26px 26px 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom)); animation: up .28s ease; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet .grab { width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: 4px auto 12px; }
.sheet h3 { margin: 0 0 4px; font-size: 1.05rem; } .sheet p { margin: 0 0 10px; color: var(--sub); font-size: .8rem; line-height: 1.7; }
.sheet textarea { width: 100%; min-height: 120px; border: 1.5px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--text); padding: 12px 14px; font: 500 .95rem 'Tajawal', sans-serif; resize: vertical; direction: ltr; text-align: left; }
.go { width: 100%; margin-top: 10px; height: 50px; border: 0; border-radius: 16px; background: var(--navy); color: #fff; font: 800 .95rem 'Tajawal', sans-serif; cursor: pointer; }
:root[data-theme="dark"] .go { background: var(--gold); color: #0f1c38; }
.fld { width: 100%; height: 50px; border: 1.5px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--text); padding: 0 14px; font: 500 .95rem 'Tajawal', sans-serif; text-align: start; }
.toast { position: fixed; bottom: calc(var(--fh) + 16px); left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 11px 18px; border-radius: 999px; font-size: .84rem; font-weight: 800; z-index: 90; box-shadow: 0 10px 28px rgba(0,0,0,.35); animation: rise .25s ease; }
@media (max-width: 380px) { .card { grid-template-columns: 48px minmax(0, 1fr) 80px; } }

.guess { display: flex; align-items: center; gap: 8px; font-size: .8rem; font-weight: 800; color: var(--gold-dark); background: color-mix(in srgb, var(--gold) 16%, transparent); border-radius: 14px; padding: 10px 12px; } :root[data-theme="dark"] .guess { color: var(--gold); }
.th { width: 54px; height: 54px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; color: var(--sub); font-size: 1.5rem; }
.th img { width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; }
@media (max-width: 380px) { .th { width: 48px; height: 48px; } }
.dact .ib.rq { color: var(--c); border-color: color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 10%, transparent); } .dact .ib.rq.off { opacity: .38; cursor: not-allowed; color: var(--sub); border-color: var(--line); background: var(--surface-2); } .dact .ib.rq.sent { opacity: .6; }
.acts .ib.rq { margin-inline-start: auto; width: 36px; height: 36px; color: var(--c); border-color: color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 10%, transparent); } .acts .ib.rq.off { opacity: .38; cursor: not-allowed; color: var(--sub); border-color: var(--line); background: var(--surface-2); } .acts .ib.rq.sent { opacity: .6; }
.need:disabled { opacity: .4; cursor: not-allowed; border-color: var(--line); color: var(--sub); }
.qty { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 14px 0 8px; } .qty button { width: 52px; height: 52px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface); color: var(--text); font-size: 1.6rem; font-weight: 800; cursor: pointer; } .qty input { width: 96px; height: 56px; text-align: center; border: 1.5px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--text); font: 800 1.5rem 'Tajawal', sans-serif; }
.acts .alc { font-size: .72rem; font-weight: 800; color: var(--ok); display: inline-flex; align-items: center; gap: 5px; }
.dh { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.dh .nv { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); display: grid; place-items: center; font-size: 1.1rem; cursor: pointer; }
.dh .nv:disabled { opacity: .35; } .dh span { font-size: .76rem; color: var(--sub); font-weight: 700; }
.dimg { width: 100%; min-height: 150px; border-radius: 20px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; cursor: zoom-in; color: var(--sub); font-size: 3rem; }
.dimg img { width: 100%; height: auto; max-height: 46vh; object-fit: contain; display: block; }
.dimg.no { cursor: default; background: var(--surface-2); }
.sheet h3.dn { margin: 14px 0 2px; font-size: 1.08rem; line-height: 1.5; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin: 10px 0; }
.kv div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 9px 12px; min-width: 0; }
.kv div.w { grid-column: 1 / -1; }
.kv small { display: block; color: var(--sub); font-size: .66rem; font-weight: 700; } .kv b { display: block; font-size: .84rem; margin-top: 2px; overflow-wrap: anywhere; }
.dpr { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0; }
.dpr .pv { font-size: 1.35rem; font-weight: 800; color: var(--gold-dark); } .dpr .pv small { font-size: .7rem; color: var(--sub); margin-inline-start: 3px; }
:root[data-theme="dark"] .dpr .pv { color: var(--gold); }
.dpr .chip { grid-column: auto; }
.nt { background: color-mix(in srgb, var(--gold) 16%, transparent); border: 1px solid color-mix(in srgb, var(--gold) 55%, transparent); border-radius: 14px; padding: 10px 12px; font-size: .82rem; font-weight: 700; line-height: 1.6; margin: 8px 0; display: flex; gap: 8px; align-items: flex-start; }
.dact { display: flex; gap: 8px; margin: 10px 0 4px; flex-wrap: wrap; }
.dact .ib { width: 46px; height: 46px; border-radius: 14px; font-size: 1.2rem; }
.dact .need { flex: 1; height: 46px; border-radius: 14px; justify-content: center; font-size: .82rem; min-width: 150px; }
.sec { font-size: .8rem; font-weight: 800; margin: 16px 0 6px; display: flex; align-items: center; gap: 7px; color: var(--text); }
.alt.lnk { cursor: pointer; } .alt .l { display: flex; align-items: center; gap: 8px; min-width: 0; } .alt .l span { overflow-wrap: anywhere; }
.alt .dt { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: 0 0 auto; }
.zoom { position: fixed; inset: 0; z-index: 80; background: rgba(8,14,30,.92); display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
.zoom img { max-width: 100%; max-height: 100%; object-fit: contain; background: #fff; border-radius: 12px; }

.fab { position: fixed; left: 16px; bottom: calc(var(--fh) + 14px); z-index: 25; width: 60px; height: 60px; border-radius: 50%; border: 0; background: linear-gradient(145deg, #fbbf24, var(--gold)); color: #0f1c38; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; box-shadow: 0 10px 26px rgba(249,168,37,.5), 0 2px 6px rgba(0,0,0,.25); font: 800 .6rem 'Tajawal', sans-serif; }

        <div style="margin-top:6px">${r.items.map((it, i) => { const x = d && d.is && d.is[i]; const t = x ? (x.s === 'no' ? '<span class="st" style="--c:var(--nosup)">غير متوفر</span>' : x.s === 'sub' ? `<span class="st" style="--c:var(--noph)">بديل: ${esc(x.sub || '')}</span>` : '<span class="st" style="--c:var(--ok)">مُجهَّز</span>') : ''; return `<div class="it"><span dir="auto"><bdi>${esc(it.n)}</bdi></span>${t}</div>`; }).join('')}</div>
        ${ms.length ? `<div class="ms">${ms.map(m => `<div class="${m.k || ''} ${m.at > seen ? 'nw' : ''}">${esc(m.t)}<small>${hm(m.at)}</small></div>`).join('')}</div>` : ''}
        <div class="addrow"><button type="button" class="addb" style="border-style:solid" data-rx="reprint" data-rid="${r.rid}">طباعة نسخة</button><button type="button" class="addb ex" style="border-style:solid" data-rx="forget" data-rid="${r.rid}">إزالة من القائمة</button></div></div>`;
    }).join('');
    sh.innerHTML = `<div class="grab"></div><div class="rxt"><h3>إشعارات الوصفات</h3></div><p>تصلك هنا ردود الصيدلية على وصفاتك المرسلة.</p>${html || '<div class="empty"><b>لا توجد وصفات مرسلة</b>اضغط زر «وصفة» لإنشاء وصفة جديدة.</div>'}`;
    sh.scrollTop = top;
    MY.forEach(r => { const d = NT[r.rid]; if (d && d.msgs && d.msgs.length) SEEN[r.rid] = Math.max(SEEN[r.rid] || 0, ...d.msgs.map(m => m.at)); }); lsSet('diwanRxSeen', SEEN); ntBadge();
}
let ntSeenView = {};
function ntOpen() { ntSeenView = {}; MY.forEach(r => ntSeenView[r.rid] = SEEN[r.rid] || 0); rxMode = 'nt'; $('sheet').classList.add('big'); $('bg').classList.remove('mid'); ntRender(); $('bg').classList.add('show'); document.body.style.overflow = 'hidden'; }
$('rxBtn').onclick = rxOpen; $('ntBtn').onclick = ntOpen;
$('sheet').addEventListener('input', e => {
    const t = e.target;
    if (rxMode === 'pick' && t.id === 'pkQ') { rxPickList(t.value); return; }
    if (rxMode === 'hist' && t.id === 'hq') { HQ = t.value; histList(); return; }
    if (rxMode !== 'form') return;
    if (t.dataset.k === 'doctor') dnShow(t.value);
    if (t.dataset.k) { RX[t.dataset.k] = t.value; t.classList.remove('bad'); saveDraft(); }
    else if (t.dataset.f) { const c = t.closest('.rxi'); RX.items[+c.dataset.i][t.dataset.f] = t.value; t.classList.remove('bad'); saveDraft(); }
});
$('sheet').addEventListener('focusin', e => { const t = e.target; if (rxMode === 'form' && t.dataset && t.dataset.k === 'doctor' && !t.value.trim()) { t.value = 'د. '; RX.doctor = t.value; saveDraft(); setTimeout(() => { try { t.setSelectionRange(t.value.length, t.value.length); } catch (x) { /* تجاهل */ } }, 0); } });
$('sheet').addEventListener('focusout', e => { const t = e.target; if (rxMode === 'form' && t.dataset && t.dataset.k === 'doctor') { setTimeout(() => dnShow(''), 0); let v = t.value.trim(); if (v && !/^د\./.test(v)) v = 'د. ' + v.replace(/^د\s+/, ''); if (/^د\.?$/.test(v)) v = ''; t.value = v; RX.doctor = v; saveDraft(); dnAdd(v); } });
$('sheet').addEventListener('focusin', e => { if (rxMode === 'form' && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) setTimeout(() => { try { e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (x) { /* تجاهل */ } }, 320); });
$('sheet').addEventListener('click', async e => {
    const b = e.target.closest('[data-rx]'), a = e.target.closest('[data-add]'), ax = e.target.closest('[data-addx]');
    if (ax && rxMode === 'pick') { const v = ($('pkQ').value || '').trim(); if (v) { RX.items.push({ p: '', n: v, ext: true, dose: '', freq: '', dur: '', ins: '' }); RXO = new Set([RX.items.length - 1]); saveDraft(); rxMode = 'form'; rxForm(); $('sheet').scrollTop = $('sheet').scrollHeight; } return; }
    if (a && rxMode === 'pick') { const m = ALL.find(x => x.id === a.dataset.add); if (m) { RX.items.push({ p: m.id, n: m.n, ext: false, dose: '', freq: '', dur: '', ins: '' }); RXO = new Set([RX.items.length - 1]); saveDraft(); rxMode = 'form'; rxForm(); $('sheet').scrollTop = $('sheet').scrollHeight; } return; }
    if (!b || !['form', 'nt', 'hist', 'rs'].includes(rxMode)) return;
    const k = b.dataset.rx;
    if (k === 'tab') { if (b.dataset.t === 'hist') { histRender(); } else { rxMode = 'form'; rxForm(); } }
    else if (k === 'rs') { rsRender(); }
    else if (k === 'rssend') { rsSend(); }
    else if (k === 'rsget') { rsGet(b); }
    else if (k === 'rscancel') { if (await ask('إلغاء طلب الاسترجاع الحالي؟', 'إلغاء الطلب')) { try { localStorage.removeItem('diwanRs'); } catch (x) { /* تجاهل */ } rsRender(); } }
    else if (k === 'reuse') { const r = MY.find(x => x.rid === b.dataset.rid); if (r) { RX = { num: mkNum(), doctor: r.doctor, patient: r.patient, dx: r.dx || '', items: (r.items || []).map(i => ({ ...i })), note: r.note || '' }; RXO = new Set(); saveDraft(); rxMode = 'form'; rxForm(); toast('نُسخت الوصفة، عدّل ما تريد ثم أرسلها'); } }
    else if (k === 'pick') { rxPickOpen(); }
    else if (k === 'back') { rxMode = 'form'; rxForm(); }
    else if (k === 'ext') { RX.items.push({ p: '', n: '', ext: true, dose: '', freq: '', dur: '', ins: '' }); RXO = new Set([RX.items.length - 1]); saveDraft(); rxForm(); $('sheet').scrollTop = $('sheet').scrollHeight; }
    else if (k === 'del') { if (await ask('حذف هذا الدواء من الوصفة؟', 'حذف')) { const di = +b.dataset.i; RX.items.splice(di, 1); RXO = new Set([...RXO].filter(x => x !== di).map(x => x > di ? x - 1 : x)); saveDraft(); rxForm(true); } }
    else if (k === 'tog') { const ti = +b.dataset.i; RXO.has(ti) ? RXO.delete(ti) : RXO.add(ti); rxForm(true); }
    else if (k === 'exp') { rxExport(); }
    else if (k === 'imp') { $('impF').value = ''; $('impF').click(); }
    else if (k === 'ins') { const it = RX.items[+b.dataset.i], t = b.dataset.t; it.ins = it.ins ? (it.ins.includes(t) ? it.ins : it.ins + '، ' + t) : t; saveDraft(); const c = b.closest('.rxi').querySelector('[data-f="ins"]'); c.value = it.ins; }
    else if (k === 'clear') { if (await ask('مسح الوصفة كاملة؟', 'مسح')) { RX = { num: mkNum(), doctor: RX.doctor, patient: '', dx: '', items: [], note: '' }; RXO = new Set(); saveDraft(); rxForm(); } }
    else if (k === 'print') { if (rxValid()) rxPrintNow(rxRec()); }
    else if (k === 'send') { rxSend(b); }
    else if (k === 'reprint') { const r = MY.find(x => x.rid === b.dataset.rid); if (r) rxPrintNow(r); }
    else if (k === 'forget') { if (await ask('حذف هذه الوصفة من جهازك؟ تبقى نسخة محفوظة عند الصيدلية.', 'حذف')) { const id = b.dataset.rid; MY = MY.filter(x => x.rid !== id); lsSet('diwanRx', MY); if (NTU[id]) { try { NTU[id](); } catch (x) { /* تجاهل */ } delete NTU[id]; } delete NT[id]; if (rxMode === 'hist') histList(); else ntRender(); } }
});


// ---------- فلتر الأقسام والتصنيفات ----------
function tfTree() {
    const tx = (doc && doc.tx) || { d: [], c: [] }, tree = tx.d.map((n, i) => ({ k: 'd' + i, n, cats: [] })); let oth = null;
    (tx.c || []).forEach((c, j) => { const t = tree[c.d] || (oth = oth || { k: 'd-1', n: 'تصنيفات أخرى', virtual: true, cats: [] }); t.cats.push({ k: 'c' + j, n: c.n }); });
    if (oth) tree.push(oth); return tree;
}
function tfCounter() { const dm = new Map(), cm = new Map(); ALL.forEach(m => { m.dk.forEach(k => dm.set(k, (dm.get(k) || 0) + 1)); m.ck.forEach(k => cm.set(k, (cm.get(k) || 0) + 1)); }); return (kind, k) => (kind === 'd' ? dm : cm).get(k) || 0; }
function tfShow(on) { $('tfHost').classList.toggle('show', on); $('tfBg').classList.toggle('show', on); }
$('fbt').onclick = () => {
    if ($('tfHost').classList.contains('show')) { tfShow(false); return; }
    TFC = TFC || { open: new Set(), q: '' };
    Object.assign(TFC, { tree: tfTree(), sel: SEL, count: tfCounter(), onChange() { shown = 60; render(false); }, onDone() { tfShow(false); } });
    tfMount($('tfHost'), TFC); tfShow(true);
};
$('tfBg').onclick = () => tfShow(false);


// ---------- طلب توفير بالعدد ----------
function qtyOpen(id) {
    const m = ALL.find(x => x.id === id); if (!m) return;
    if (m.st === 'nosup') { toast('غير متوفر لدى المذخر حالياً'); return; }
    const key = 'dn_' + id; if (SENT[key] && Date.now() - SENT[key] < WEEK) { toast('سُجِّل طلبك مسبقاً'); return; }
    openSheet(`<h3>طلب توفير</h3><p dir="auto"><bdi>${esc(m.n)}</bdi><br>حدّد العدد المطلوب وسيصل الطلب إلى الصيدلية.</p>
    <div class="qty"><button type="button" data-q="-1" aria-label="إنقاص">−</button><input id="qtyN" type="number" inputmode="numeric" min="1" max="999" value="1"><button type="button" data-q="1" aria-label="زيادة">+</button></div>
    <div class="qc" style="justify-content:center">${[1, 2, 3, 5, 10, 20].map(n => `<button type="button" data-qs="${n}">${n}</button>`).join('')}</div>
    <button type="button" class="go" id="qtyGo" data-qid="${esc(id)}">إرسال الطلب</button>`);
}
$('sheet').addEventListener('click', async e => {
    const q = e.target.closest('[data-q]'), qs = e.target.closest('[data-qs]'), go = e.target.closest('#qtyGo'), i = $('qtyN');
    if (q && i) i.value = Math.min(999, Math.max(1, (+i.value || 1) + +q.dataset.q));
    else if (qs && i) i.value = qs.dataset.qs;
    else if (go && i) {
        const n = Math.min(999, Math.max(1, Math.floor(+i.value || 1))), m = ALL.find(x => x.id === go.dataset.qid); if (!m) return;
        go.disabled = true; await sendReq('n', m.id, m.n, null, false, '', n); closeSheet(); render(false);
    }
});

// ---------- زر الرجوع: يغلق آخر نافذة بدل مغادرة الصفحة ----------
const LAY = []; let lyIgn = 0;
function lyOpen(n) { if (LAY.includes(n)) return; LAY.push(n); try { history.pushState({ ly: n }, ''); } catch (e) { /* تجاهل */ } }
function lyClosed(n) { const i = LAY.lastIndexOf(n); if (i < 0) return; LAY.splice(i, 1); lyIgn++; try { history.back(); } catch (e) { lyIgn--; } }
addEventListener('popstate', () => {
    if (lyIgn) { lyIgn--; return; }
    const n = LAY.pop(); if (!n) return;
    if (n === 'zoom') { const z = document.querySelector('.zoom'); if (z) z.remove(); }
    else if (n === 'tf') tfShow(false);
    else if (n === 'sheet') { if (rxMode === 'pick') { rxMode = 'form'; rxForm(); lyOpen('sheet'); return; } closeSheet(); }
});
try {
    new MutationObserver(() => { $('bg').classList.contains('show') ? lyOpen('sheet') : lyClosed('sheet'); }).observe($('bg'), { attributes: true, attributeFilter: ['class'] });
    new MutationObserver(() => { $('tfHost').classList.contains('show') ? lyOpen('tf') : lyClosed('tf'); }).observe($('tfHost'), { attributes: true, attributeFilter: ['class'] });
    new MutationObserver(ms => { ms.forEach(m => { m.addedNodes.forEach(n => { if (n.classList && n.classList.contains('zoom')) { lyOpen('zoom'); new MutationObserver(() => { if (!document.body.contains(n)) lyClosed('zoom'); }).observe(document.body, { childList: true }); } }); }); }).observe(document.body, { childList: true });
} catch (e) { /* تجاهل */ }

$('reqBtn').onclick = () => reqOpen(q.trim());
$('bg').addEventListener('click', e => { if (e.target === $('bg')) closeSheet(); });
$('favBtn').onclick = () => { favOnly = !favOnly; shown = 60; render(true); };
$('theme').onclick = () => { const r = document.documentElement, n = r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; r.setAttribute('data-theme', n); try { localStorage.setItem('diwanTheme', n); } catch (e) { /* تجاهل */ } };

try { const c = JSON.parse(localStorage.getItem(LS)); if (c) setDoc(c); } catch (e) { /* تجاهل */ }
try {
    firebase.initializeApp(firebaseConfig);
    firebase.firestore().collection('pharmacy').doc('doctor').onSnapshot(s => { if (s.exists) setDoc(s.data()); else if (!doc) setDoc(null); }, () => { if (!doc) setDoc(null); });
} catch (e) { if (!doc) setDoc(null); }
try { ntWatch(); ntBadge(); } catch (e) { /* تجاهل */ }
function fit() { const r = document.documentElement.style; r.setProperty('--hh', $('top').offsetHeight + 'px'); r.setProperty('--fh', $('foot').offsetHeight + 'px'); }
fit(); addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 200));
try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit); if (window.ResizeObserver) { const ro = new ResizeObserver(fit); ro.observe($('top')); ro.observe($('foot')); } } catch (e) { /* تجاهل */ }
setInterval(render, 600000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
