<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>توفر الأدوية للأطباء | صيدلية الديوان</title>
<meta name="theme-color" content="#0f1c38">
<meta name="robots" content="noindex">
<script>try{var t=localStorage.getItem("diwanTheme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="icon" type="image/jpeg" href="icon.jpg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root {
    --navy: #0f1c38; --navy-soft: #1b2c52; --gold: #f9a825; --gold-dark: #a85d08;
    --bg: #f1f4f9; --surface: #ffffff; --surface-2: #f6f8fc; --text: #0f1c38; --sub: #64748b; --line: #e2e8f0;
    --ok: #16a34a; --noph: #d97706; --nosup: #dc2626; --back: #2563eb;
    --shadow: 0 1px 2px rgba(15,28,56,.06), 0 6px 18px rgba(15,28,56,.06);
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0a1020; --surface: #141e36; --surface-2: #1a2745; --text: #e8edf7; --sub: #9aa8c2; --line: #2a3857;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { font-family: 'Tajawal', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
button { font-family: inherit; }
svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

/* ---------- الترويسة ---------- */
.hero { background: linear-gradient(160deg, var(--navy) 0%, var(--navy-soft) 100%); color: #fff; padding: calc(16px + env(safe-area-inset-top)) 16px 64px; border-radius: 0 0 30px 30px; position: relative; overflow: hidden; }
.hero::before { content: ''; position: absolute; inset: 0; opacity: .07; background-image: radial-gradient(circle at 1px 1px, #fff 1px, transparent 0); background-size: 18px 18px; }
.hero-in { position: relative; max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.hero img { width: 46px; height: 46px; border-radius: 14px; object-fit: cover; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
.brand { flex: 1; min-width: 0; }
.brand b { display: block; font-family: 'Aref Ruqaa', serif; font-size: 1.45rem; color: var(--gold); line-height: 1.2; }
.brand small { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: #cbd5e1; font-weight: 500; margin-top: 2px; }
.theme { width: 42px; height: 42px; border-radius: 13px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.1); color: #fff; font-size: 1.1rem; display: grid; place-items: center; cursor: pointer; }
.upd { position: relative; max-width: 760px; margin: 14px auto 0; display: inline-flex; align-items: center; gap: 7px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16); border-radius: 999px; padding: 6px 12px; font-size: .74rem; color: #e2e8f0; }
.upd i { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 3px rgba(52,211,153,.25); }
.hero-wrap { max-width: 760px; margin: 0 auto; position: relative; }

/* ---------- البحث ---------- */
.search-wrap { position: sticky; top: 0; z-index: 20; margin-top: -34px; padding: 0 14px; }
.search { max-width: 732px; margin: 0 auto; display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 18px; padding: 0 16px; height: 54px; box-shadow: 0 10px 28px rgba(15,28,56,.22); border: 1px solid var(--line); }
.search svg { font-size: 1.25rem; color: var(--sub); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: 500 1rem 'Tajawal', sans-serif; color: var(--text); height: 100%; }
.search input::placeholder { color: var(--sub); }
.search button { border: 0; background: var(--surface-2); color: var(--sub); width: 28px; height: 28px; border-radius: 50%; display: none; place-items: center; cursor: pointer; }
.search.has button { display: grid; }

/* ---------- التخطيط ---------- */
.layout { max-width: 760px; margin: 14px auto 0; padding: 0 14px; display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 12px; align-items: start; }
.rail { position: sticky; top: 78px; display: flex; flex-direction: column; gap: 10px; padding-inline-end: 8px; }
.tab { position: relative; border: 1px solid var(--line); background: var(--surface); color: var(--sub); border-radius: 18px; padding: 11px 4px 9px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; box-shadow: var(--shadow); transition: transform .28s cubic-bezier(.2,.9,.25,1.2), background .2s, color .2s, box-shadow .2s, border-color .2s; }
.tab .ic { width: 38px; height: 38px; border-radius: 13px; display: grid; place-items: center; font-size: 1.3rem; background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); transition: background .2s, color .2s; }
.tab .lb { font-size: .66rem; font-weight: 800; line-height: 1.35; text-align: center; color: var(--text); padding: 0 2px; }
.tab .ct { font-size: .74rem; font-weight: 800; color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); border-radius: 999px; padding: 1px 9px; min-width: 28px; }
.tab.on { transform: translateX(-9px); background: var(--c); border-color: var(--c); box-shadow: 0 10px 22px color-mix(in srgb, var(--c) 45%, transparent); }
.tab.on .ic { background: rgba(255,255,255,.22); color: #fff; } .tab.on .lb { color: #fff; } .tab.on .ct { background: rgba(255,255,255,.25); color: #fff; }
.tab:active { transform: scale(.96); } .tab.on:active { transform: translateX(-9px) scale(.97); }
.t-ok { --c: var(--ok); } .t-noph { --c: var(--noph); } .t-nosup { --c: var(--nosup); } .t-back { --c: var(--back); }

/* ---------- القائمة ---------- */
.head-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 34px; margin-bottom: 8px; }
.head-line b { font-size: .95rem; } .head-line small { color: var(--sub); font-weight: 500; }
.clear { border: 0; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font: 800 .74rem 'Tajawal', sans-serif; cursor: pointer; display: none; }
.clear.show { display: inline-flex; }
.list { display: flex; flex-direction: column; gap: 10px; }
.list.anim .card { animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.card { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 8px 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 13px 16px 13px 14px; box-shadow: var(--shadow); }
.card::before { content: ''; position: absolute; inset-block: 12px; inset-inline-start: 0; width: 4px; border-radius: 0 4px 4px 0; background: var(--c); }
.card .nm { min-width: 0; }
.card .nm b { display: block; font-size: .95rem; font-weight: 800; line-height: 1.45; overflow-wrap: anywhere; }
.card .nm small { display: block; color: var(--sub); font-size: .74rem; margin-top: 2px; line-height: 1.5; overflow-wrap: anywhere; }
.card .pr { text-align: end; font-weight: 800; color: var(--gold-dark); font-size: 1rem; line-height: 1.2; }
.card .pr small { display: block; font-size: .66rem; font-weight: 700; color: var(--sub); margin-top: 2px; }
:root[data-theme="dark"] .card .pr { color: var(--gold); }
.chip { grid-column: 1 / -1; justify-self: start; display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 800; color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); border-radius: 999px; padding: 4px 11px 4px 12px; }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.chip em { font-style: normal; font-weight: 600; color: var(--sub); }
.s-ok { --c: var(--ok); } .s-noph { --c: var(--noph); } .s-nosup { --c: var(--nosup); } .s-back { --c: var(--back); }
.more { border: 1.5px dashed var(--line); background: transparent; color: var(--text); border-radius: 16px; padding: 13px; font: 800 .85rem 'Tajawal', sans-serif; cursor: pointer; }
.empty { text-align: center; color: var(--sub); padding: 46px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: 18px; }
.empty svg { font-size: 2.2rem; opacity: .6; margin-bottom: 8px; } .empty b { display: block; color: var(--text); margin-bottom: 4px; }
.sk { height: 84px; border-radius: 18px; background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: sh 1.2s infinite; border: 1px solid var(--line); }
@keyframes sh { to { background-position: -200% 0; } }
.foot { max-width: 760px; margin: 22px auto 0; padding: 0 20px; text-align: center; color: var(--sub); font-size: .74rem; line-height: 1.8; }
@media (max-width: 380px) { .layout { grid-template-columns: 70px minmax(0, 1fr); gap: 8px; } .tab .lb { font-size: .6rem; } .card { grid-template-columns: minmax(0, 1fr) 84px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="hero">
    <div class="hero-in">
        <img src="icon.jpg" alt="">
        <div class="brand"><b>صيدلية الديوان</b><small><svg viewBox="0 0 24 24"><path d="M11 2v2"/><path d="M5 2v2"/><path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"/><path d="M8 15a6 6 0 0 0 12 0v-3"/><circle cx="20" cy="10" r="2"/></svg>دليل توفر الأدوية للأطباء</small></div>
        <button class="theme" id="theme" aria-label="تبديل الوضع"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></button>
    </div>
    <div class="hero-wrap"><div class="upd" id="upd"><i></i><span id="updT">جارٍ التحديث…</span></div></div>
</header>

<div class="search-wrap">
    <label class="search" id="sbox"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="ابحث باسم الدواء أو المادة الفعالة">
        <button type="button" id="qx" aria-label="مسح"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </label>
</div>

<main class="layout">
    <nav class="rail" id="rail" aria-label="حالة التوفر"></nav>
    <section>
        <div class="head-line"><b id="hl">كل المواد <small id="hc"></small></b><button type="button" class="clear" id="clr">عرض الكل</button></div>
        <div class="list" id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
    </section>
</main>
<p class="foot">الحالة تُحدَّث باستمرار وقد تتغيّر خلال اليوم. للتأكيد على مادة بعينها تواصل مع الصيدلية.</p>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDimxdd2vaKdOFw-IDYfWaivslosGMFVh4", authDomain: "al-d1-pharmacy.firebaseapp.com", projectId: "al-d1-pharmacy",
  storageBucket: "al-d1-pharmacy.firebasestorage.app", messagingSenderId: "670194103463", appId: "1:670194103463:web:ab22898112c5a5b9a69782"
};
const LS = 'diwanDocPublic';
const ST = {
    ok: { t: 'متوفر', lb: 'متوفر', ic: '<path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/>' },
    noph: { t: 'غير متوفر بالصيدلية', lb: 'غير متوفر بالصيدلية', ic: '<path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14"/><path d="m7.5 4.27 9 5.15"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" x2="12" y1="22" y2="12"/><path d="m17 13 5 5m-5 0 5-5"/>' },
    nosup: { t: 'غير متوفر لدى المذخر', lb: 'غير متوفر بالمذخر', ic: '<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>' },
    back: { t: 'عاد بعد انقطاع', lb: 'عاد بعد انقطاع', ic: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>' }
};
const ORDER = ['ok', 'noph', 'nosup', 'back'];
let doc = null, tab = '', q = '', shown = 60;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').toLowerCase().replace(/[ً-ٟ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');
const num = n => Number(n).toLocaleString('en-US');
const svg = p => `<svg viewBox="0 0 24 24">${p}</svg>`;

function eff(it, cfg) {
    if (it.s === 'back' && Date.now() - (it.t || 0) <= (cfg.days || 7) * 864e5) return 'back';
    if (it.s === 'nosup') return 'nosup';
    if (cfg.auto && it.k != null) return it.k ? 'ok' : 'noph';
    return it.s === 'noph' ? 'noph' : 'ok';
}
function model() {
    if (!doc) return [];
    const cfg = doc.cfg || {}, out = [];
    Object.keys(doc.items || {}).forEach(id => { const it = doc.items[id]; if (!it || !it.n) return; out.push({ id, n: it.n, a: it.a || '', p: it.p || 0, st: eff(it, cfg), t: it.t || 0, hay: norm(it.n + ' ' + (it.a || '')) }); });
    out.sort((a, b) => ORDER.indexOf(a.st) - ORDER.indexOf(b.st) || a.n.localeCompare(b.n, 'en'));
    return out;
}
function ago(t) { const d = Math.floor((Date.now() - t) / 864e5); return d <= 0 ? 'عاد اليوم' : d === 1 ? 'عاد أمس' : 'عاد قبل ' + d + ' أيام'; }
function renderRail(all) {
    const c = {}; ORDER.forEach(k => c[k] = 0); all.forEach(m => c[m.st]++);
    $('rail').innerHTML = ORDER.map(k => `<button type="button" class="tab t-${k} ${tab === k ? 'on' : ''}" data-k="${k}" aria-pressed="${tab === k}"><span class="ic">${svg(ST[k].ic)}</span><span class="lb">${ST[k].lb}</span><span class="ct">${num(c[k])}</span></button>`).join('');
}
function render(anim) {
    const all = model(), cfg = (doc && doc.cfg) || {};
    renderRail(all);
    const nq = norm(q.trim());
    let rows = all.filter(m => (!tab || m.st === tab) && (!nq || m.hay.includes(nq)));
    $('hl').firstChild.nodeValue = tab ? ST[tab].t + ' ' : 'كل المواد ';
    $('hc').textContent = '· ' + num(rows.length);
    $('clr').classList.toggle('show', !!tab);
    const box = $('list');
    if (!doc) return;
    if (!all.length) { box.innerHTML = `<div class="empty">${svg('<circle cx="12" cy="12" r="10"/><path d="M8 15h8M9 9h.01M15 9h.01"/>')}<b>لا توجد مواد معروضة حالياً</b>سيظهر هنا ما تحدده الصيدلية للأطباء.</div>`; return; }
    if (!rows.length) { box.innerHTML = `<div class="empty">${svg('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>')}<b>لا توجد نتائج</b>جرّب اسماً آخر أو أزل التصفية.</div>`; return; }
    const part = rows.slice(0, shown);
    box.classList.toggle('anim', !!anim);
    box.innerHTML = part.map(m => `<article class="card s-${m.st}">
        <div class="nm"><b dir="rtl"><bdi>${esc(m.n)}</bdi></b>${m.a ? `<small dir="rtl"><bdi>${esc(m.a)}</bdi></small>` : ''}</div>
        <div class="pr">${cfg.prices !== false && m.p ? `${num(m.p)}<small>د.ع</small>` : ''}</div>
        <span class="chip"><i></i>${ST[m.st].t}${m.st === 'back' && m.t ? ` <em>· ${ago(m.t)}</em>` : ''}</span>
    </article>`).join('') + (rows.length > part.length ? `<button type="button" class="more" id="more">عرض المزيد (${num(rows.length - part.length)})</button>` : '');
    const mb = $('more'); if (mb) mb.onclick = () => { shown += 80; render(false); };
}
function stamp() {
    if (!doc || !doc.upd) { $('updT').textContent = 'الحالة حسب آخر تحديث'; return; }
    const d = new Date(doc.upd), now = new Date(), same = d.toDateString() === now.toDateString();
    const h = d.getHours(), tm = ((h % 12) || 12) + ':' + String(d.getMinutes()).padStart(2, '0') + (h < 12 ? ' ص' : ' م');
    $('updT').textContent = 'آخر تحديث ' + (same ? 'اليوم ' : d.getDate() + '/' + (d.getMonth() + 1) + ' ') + tm;
}
function setDoc(d) { doc = d || { cfg: {}, items: {} }; stamp(); render(false); try { localStorage.setItem(LS, JSON.stringify(doc)); } catch (e) { /* تجاهل */ } }

$('rail').addEventListener('click', e => { const b = e.target.closest('.tab'); if (!b) return; const k = b.dataset.k; tab = tab === k ? '' : k; shown = 60; render(true); if (navigator.vibrate) try { navigator.vibrate(8); } catch (x) { /* تجاهل */ } });
$('clr').onclick = () => { tab = ''; shown = 60; render(true); };
$('q').addEventListener('input', e => { q = e.target.value; $('sbox').classList.toggle('has', !!q); shown = 60; render(false); });
$('qx').onclick = () => { $('q').value = ''; q = ''; $('sbox').classList.remove('has'); render(false); $('q').focus(); };
$('theme').onclick = () => { const r = document.documentElement, n = r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; r.setAttribute('data-theme', n); try { localStorage.setItem('diwanTheme', n); } catch (e) { /* تجاهل */ } };

try { const c = JSON.parse(localStorage.getItem(LS)); if (c) setDoc(c); } catch (e) { /* تجاهل */ }
try {
    firebase.initializeApp(firebaseConfig);
    firebase.firestore().collection('pharmacy').doc('doctor').onSnapshot(s => { if (s.exists) setDoc(s.data()); else if (!doc) setDoc(null); }, () => { if (!doc) setDoc(null); });
} catch (e) { if (!doc) setDoc(null); }
setInterval(render, 600000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
</body>
</html>
