    return ALL.filter(x => x.id !== m.id && x.ik === m.ik && (x.st === 'ok' || x.st === 'back')).slice(0, 8);
}
function ago(t) { const d = Math.floor((Date.now() - t) / 864e5); return d <= 0 ? 'عاد اليوم' : d === 1 ? 'عاد أمس' : 'عاد قبل ' + d + ' أيام'; }
function renderRail(all) {
    const c = {}; ORDER.forEach(k => c[k] = 0); all.forEach(m => c[m.st]++);
    $('rail').innerHTML = ORDER.map(k => `<button type="button" class="tab t-${k} ${tab === k ? 'on' : ''}" data-k="${k}" aria-pressed="${tab === k}"><span class="ic">${svg(ST[k].ic)}</span><span class="lb">${ST[k].lb}</span><span class="ct">${num(c[k])}</span></button>`).join('');
}
function toast(t) { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 2200); }
function reqBtn(m, big) {
    const key = 'dn_' + m.id, done = SENT[key] && Date.now() - SENT[key] < WEEK;
    return `<button type="button" class="need ${done ? 'done' : ''}" data-need="${m.id}">${svg(IC.hand)}${done ? 'سُجِّل طلبك' : 'أحتاج هذه المادة'}</button>`;
}
function cardHtml(m, cfg) {
    const unav = m.st === 'noph' || m.st === 'nosup', alts = unav ? altsOf(m) : [];
    return `<article class="card s-${m.st}">
        <div class="nm"><b dir="rtl"><bdi>${esc(m.n)}</bdi>${m.isNew ? '<span class="tag">جديد</span>' : ''}${m.pc ? '<span class="tag">تغيّر السعر</span>' : ''}</b>${m.a ? `<small dir="rtl"><bdi>${esc(m.a)}</bdi></small>` : ''}</div>
        <div class="pr">${cfg.prices !== false && m.p ? `${num(m.p)}<small>د.ع</small>` : ''}</div>
        <div class="acts"><span class="chip"><i></i>${ST[m.st].t}${m.st === 'back' && m.t ? ` <em>· ${ago(m.t)}</em>` : ''}</span>
            ${unav ? reqBtn(m) : ''}
            <button type="button" class="ib ${FAV.has(m.id) ? 'on' : ''}" data-fav="${m.id}" aria-label="المفضلة">${svg(IC.star)}</button>
            <button type="button" class="ib" data-share="${m.id}" aria-label="مشاركة">${svg(IC.share)}</button></div>
        ${unav ? (alts.length ? `<details class="alts"><summary>${svg(IC.swap)} بدائل متوفرة بنفس المادة الفعالة (${num(alts.length)})</summary>${alts.map(a => `<div class="alt"><span dir="rtl"><bdi>${esc(a.n)}</bdi></span>${cfg.prices !== false && a.p ? `<b>${num(a.p)} د.ع</b>` : ''}</div>`).join('')}</details>` : '') : ''}
    </article>`;
}
function render(anim) {
    const all = model(), cfg = (doc && doc.cfg) || {};
    ALL = all;
    renderRail(all);
    const nq = norm(q.trim());
    let rows = all.filter(m => (!tab || m.st === tab) && (!favOnly || FAV.has(m.id)) && (!nq || m.hay.includes(nq)));
    $('hl').firstChild.nodeValue = (favOnly ? 'المفضلة · ' : '') + (tab ? ST[tab].t : 'كل المواد') + ' ';
    $('hc').textContent = '· ' + num(rows.length);
    $('clr').classList.toggle('show', !!tab);
    $('favBtn').classList.toggle('on', favOnly);
    $('favN').textContent = FAV.size ? '(' + num(FAV.size) + ')' : '';
    const box = $('list');
    if (!doc) return;
    if (!all.length) { box.innerHTML = `<div class="empty">${svg('<circle cx="12" cy="12" r="10"/><path d="M8 15h8M9 9h.01M15 9h.01"/>')}<b>لا توجد مواد معروضة حالياً</b></div>`; return; }
    if (!rows.length) {
        box.innerHTML = `<div class="empty">${svg('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>')}<b>${favOnly && !nq ? 'لم تضف مواد إلى المفضلة بعد' : 'لا توجد نتائج'}</b>${favOnly && !nq ? 'اضغط على النجمة في أي مادة لحفظها هنا.' : ''}${nq ? `<br><button type="button" class="need s-ok" style="margin-top:12px" id="askQ">${svg(IC.plus)}اطلب هذه المادة من الصيدلية</button>` : ''}</div>`;
        const a = $('askQ'); if (a) a.onclick = () => sendReq('q', '', q.trim(), a);
        return;
    }
    const part = rows.slice(0, shown);
    box.classList.toggle('anim', !!anim);
    box.innerHTML = part.map(m => cardHtml(m, cfg)).join('') + (rows.length > part.length ? `<button type="button" class="more" id="more">عرض المزيد (${num(rows.length - part.length)})</button>` : '');
    const mb = $('more'); if (mb) mb.onclick = () => { shown += 80; render(false); };
}
// ---------- طلبات الأطباء (تصل إلى الصيدلي) ----------
async function sendReq(kind, id, name, btn) {
    const key = kind === 'n' ? 'dn_' + id : 'dq_' + encodeURIComponent(norm(name)).slice(0, 150);
    if (SENT[key] && Date.now() - SENT[key] < WEEK) { toast('سُجِّل طلبك مسبقاً'); return; }
    try {
        await firebase.firestore().collection('pharmacy_search_misses').doc(key).set({ dr: 1, kind, pid: id || null, name, count: firebase.firestore.FieldValue.increment(1), lastAt: new Date().toISOString() }, { merge: true });
        SENT[key] = Date.now(); lsSet('diwanDocSent', SENT);
        toast('سُجِّل طلبك وسيصل إلى الصيدلية');
        if (btn) { btn.classList.add('done'); btn.lastChild.nodeValue = kind === 'n' ? 'سُجِّل طلبك' : 'أُرسل الطلب'; }
    } catch (e) { toast('تعذر إرسال الطلب، حاول لاحقاً'); }
}
async function shareItem(m) {
    const t = m.n + '\nالحالة: ' + ST[m.st].t + (doc.cfg.prices !== false && m.p ? '\nالسعر: ' + num(m.p) + ' د.ع' : '') + '\nصيدلية الديوان';
    try { if (navigator.share) { await navigator.share({ title: m.n, text: t, url: location.href }); return; } } catch (e) { return; }
    try { await navigator.clipboard.writeText(t + '\n' + location.href); toast('تم نسخ المعلومات'); } catch (e) { toast('تعذرت المشاركة'); }
}
// ---------- فحص الوصفة ----------
function openSheet(html) { $('sheet').innerHTML = '<div class="grab"></div>' + html; $('bg').classList.add('show'); document.body.style.overflow = 'hidden'; }
function closeSheet() { $('bg').classList.remove('show'); document.body.style.overflow = ''; }
function rxOpen() {
    openSheet(`<h3>فحص وصفة</h3><p>اكتب أسماء الأدوية، كل دواء في سطر (أو افصل بينها بفاصلة)، لتعرف توفرها وبدائلها دفعة واحدة.</p>
    <textarea id="rxT" placeholder="Augmentin 1g&#10;Panadol Extra&#10;Tamoxifen" dir="ltr"></textarea><button type="button" class="go" id="rxGo">افحص الوصفة</button><div class="rxr" id="rxR"></div>`);
    $('rxGo').onclick = rxRun;
}
function rxMatch(line) {
    const toks = norm(line).split(/[^a-z0-9؀-ۿ.]+/).filter(t => t.length > 1);
    if (!toks.length) return [];
    return ALL.filter(m => toks.every(t => m.hay.includes(t))).sort((a, b) => a.n.length - b.n.length).slice(0, 3);
}
function rxRun() {
    const lines = $('rxT').value.split(/[\n,،;+]+/).map(x => x.trim()).filter(Boolean).slice(0, 30);
    const cfg = doc.cfg || {};
    $('rxR').innerHTML = lines.map((ln, i) => {
        const ms = rxMatch(ln);
        if (!ms.length) return `<div class="rxi"><div class="rxm"><b dir="ltr">${esc(ln)}</b><span class="chip s-noph" style="grid-column:auto"><i></i>غير موجودة في القائمة</span></div><button type="button" class="need s-ok" data-rq="${i}">${svg(IC.plus)}اطلبها من الصيدلية</button></div>`;
        return ms.map(m => { const unav = m.st === 'noph' || m.st === 'nosup', al = unav ? altsOf(m).slice(0, 3) : [];
            return `<div class="rxi s-${m.st}"><div class="rxm"><b dir="ltr"><bdi>${esc(m.n)}</bdi></b>${cfg.prices !== false && m.p ? `<b style="color:var(--gold-dark);white-space:nowrap">${num(m.p)} د.ع</b>` : ''}</div>
            <span class="chip" style="grid-column:auto"><i></i>${ST[m.st].t}</span>${al.length ? `<small>البدائل المتوفرة: ${al.map(a => esc(a.n)).join('، ')}</small>` : ''}</div>`; }).join('');
    }).join('') || '<div class="empty">اكتب دواءً واحداً على الأقل.</div>';
    $('rxR').querySelectorAll('[data-rq]').forEach(b => b.onclick = () => sendReq('q', '', lines[+b.dataset.rq], b));
}
function stamp() {
    if (!doc || !doc.upd) { $('updT').textContent = 'الحالة حسب آخر تحديث'; return; }
    const d = new Date(doc.upd), now = new Date(), same = d.toDateString() === now.toDateString();
    const h = d.getHours(), tm = ((h % 12) || 12) + ':' + String(d.getMinutes()).padStart(2, '0') + (h < 12 ? ' ص' : ' م');
    $('updT').textContent = 'آخر تحديث ' + (same ? 'اليوم ' : d.getDate() + '/' + (d.getMonth() + 1) + ' ') + tm;
}
function setDoc(d) { doc = d || { cfg: {}, items: {} }; stamp(); render(false); try { localStorage.setItem(LS, JSON.stringify(doc)); } catch (e) { /* تجاهل */ } }

$('rail').addEventListener('click', e => { const b = e.target.closest('.tab'); if (!b) return; const k = b.dataset.k; tab = tab === k ? '' : k; shown = 60; render(true); if (navigator.vibrate) try { navigator.vibrate(8); } catch (x) { /* تجاهل */ } });
$('clr').onclick = () => { tab = ''; shown = 60; render(true); };
$('q').addEventListener('input', e => { q = e.target.value; $('sbox').classList.toggle('has', !!q); shown = 60; render(false); });
$('qx').onclick = () => { $('q').value = ''; q = ''; $('sbox').classList.remove('has'); render(false); $('q').focus(); };
$('list').addEventListener('click', e => {
    const f = e.target.closest('[data-fav]'), sh = e.target.closest('[data-share]'), nd = e.target.closest('[data-need]');
    if (f) { const id = f.dataset.fav; FAV.has(id) ? FAV.delete(id) : FAV.add(id); lsSet('diwanDocFav', [...FAV]); render(false); }
    else if (sh) { const m = ALL.find(x => x.id === sh.dataset.share); if (m) shareItem(m); }
    else if (nd) { const m = ALL.find(x => x.id === nd.dataset.need); if (m) sendReq('n', m.id, m.n, nd); }
});
$('rxBtn').onclick = rxOpen;
$('favBtn').onclick = () => { favOnly = !favOnly; shown = 60; render(true); };
$('bg').addEventListener('click', e => { if (e.target === $('bg')) closeSheet(); });
$('sheet').addEventListener('click', e => { const nd = e.target.closest('[data-rq]'); if (nd) return; });
$('theme').onclick = () => { const r = document.documentElement, n = r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; r.setAttribute('data-theme', n); try { localStorage.setItem('diwanTheme', n); } catch (e) { /* تجاهل */ } };

try { const c = JSON.parse(localStorage.getItem(LS)); if (c) setDoc(c); } catch (e) { /* تجاهل */ }
try {
    firebase.initializeApp(firebaseConfig);
    firebase.firestore().collection('pharmacy').doc('doctor').onSnapshot(s => { if (s.exists) setDoc(s.data()); else if (!doc) setDoc(null); }, () => { if (!doc) setDoc(null); });
} catch (e) { if (!doc) setDoc(null); }
setInterval(render, 600000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
</body>
